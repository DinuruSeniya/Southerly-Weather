name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  MANIFEST: Southerly/Package.appxmanifest

jobs:
  release:
    name: Build and publish release
    # MSIX packaging and signing need Windows-only tooling, so one Windows job does everything
    # rather than paying for extra jobs and artifact hand-offs.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if ($env:GITHUB_REF_NAME -ne 'main') { throw 'Releases must be run from the main branch.' }

          [xml]$manifest = Get-Content $env:MANIFEST -Raw
          $previousTag = git tag --list 'v*.*.*' --sort=-version:refname | Select-Object -First 1
          $current = if ($previousTag) { [version]$previousTag.TrimStart('v') } else { [version]$manifest.Package.Identity.Version }

          $version = switch ($env:BUMP) {
            'major' { "$($current.Major + 1).0.0" }
            'minor' { "$($current.Major).$($current.Minor + 1).0" }
            'patch' { "$($current.Major).$($current.Minor).$($current.Build + 1)" }
          }
          if (git tag --list "v$version") { throw "Tag v$version already exists." }

          # The Store reserves the fourth version field, so it stays 0.
          $manifest.Package.Identity.Version = "$version.0"
          $manifest.Save((Resolve-Path $env:MANIFEST))

          "VERSION=$version" >> $env:GITHUB_ENV
          "PREVIOUS_TAG=$previousTag" >> $env:GITHUB_ENV
          "PUBLISHER=$($manifest.Package.Identity.Publisher)" >> $env:GITHUB_ENV
          "Releasing v$version (previous: $(if ($previousTag) { $previousTag } else { 'none' }))"

      - name: Load signing certificate
        env:
          SIGNING_CERT_PFX: ${{ secrets.SIGNING_CERT_PFX }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP signing.pfx

          if ($env:SIGNING_CERT_PFX) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_PFX))
            $password = $env:SIGNING_CERT_PASSWORD
          } else {
            "::warning::SIGNING_CERT_PFX is not set, so this release is signed with a one-off self-signed certificate."
            $password = [guid]::NewGuid().ToString()
            "::add-mask::$password"
            $cert = New-SelfSignedCertificate -Type Custom -Subject $env:PUBLISHER -KeyUsage DigitalSignature `
              -FriendlyName 'Southerly sideload signing' -CertStoreLocation Cert:\CurrentUser\My `
              -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
            'SIGNING_EPHEMERAL=true' >> $env:GITHUB_ENV
          }

          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, $password)
          if ($cert.Subject -ne $env:PUBLISHER) { throw "Certificate subject '$($cert.Subject)' must match the manifest publisher '$env:PUBLISHER'." }

          New-Item -ItemType Directory dist | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD dist\Southerly.cer), $cert.Export('Cert'))

          "SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          "SIGNING_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build and sign packages
        run: |
          foreach ($platform in 'x64', 'ARM64') {
            $arch = $platform.ToLowerInvariant()
            $out = Join-Path $env:RUNNER_TEMP "AppPackages\$arch"

            dotnet publish Southerly/Southerly.csproj -c Release -p:Platform=$platform -p:PublishProfile=win-$arch `
              -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never `
              -p:UapAppxPackageBuildMode=SideloadOnly -p:AppxPackageDir="$out\" -p:AppxPackageTestDir="$out\"
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $arch" }

            $msix = "dist\Southerly_$($env:VERSION)_$arch.msix"
            Move-Item "$out\*.msix" $msix

            $signtool = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.buildtools" -Recurse -Filter signtool.exe |
              Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1 -ExpandProperty FullName
            & $signtool sign /fd SHA256 /f $env:SIGNING_PFX /p $env:SIGNING_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $msix
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $arch" }
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: Create release notes
        run: |
          $range = if ($env:PREVIOUS_TAG) { "$env:PREVIOUS_TAG..HEAD" } else { 'HEAD' }
          $changes = git log --no-merges --pretty=format:'- %s' $range
          if (-not $changes) { $changes = '- No changes since the previous release.' }

          $notes = @(
            if ($env:PREVIOUS_TAG) { "## Changes since $env:PREVIOUS_TAG" } else { '## Changes' }
            ''
            $changes
            ''
            '## Install'
            ''
            'Southerly is sideloaded for now, so Windows has to trust its signing certificate before the package will install.'
            ''
            '1. Download `Southerly.cer` and the package for your PC: `x64` for Intel and AMD, `arm64` for Snapdragon and other Arm devices.'
            '2. Trust the certificate from an administrator PowerShell (only needed once per certificate):'
            '   ```powershell'
            '   Import-Certificate -FilePath .\Southerly.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople'
            '   ```'
            '3. Double-click the `.msix` to install, then add Southerly from the Widgets board.'
            if ($env:SIGNING_EPHEMERAL) {
              ''
              '> [!NOTE]'
              '> This release is signed with a one-off certificate, so trust this release''s `Southerly.cer` even if you trusted an earlier one.'
            }
          )
          $notes | Set-Content -Path (Join-Path $env:RUNNER_TEMP release-notes.md) -Encoding utf8

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem dist).FullName
          gh release create "v$env:VERSION" @assets --target $env:GITHUB_SHA --title "Southerly v$env:VERSION" `
            --notes-file (Join-Path $env:RUNNER_TEMP release-notes.md)
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the release.' }
